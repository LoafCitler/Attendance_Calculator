<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Attendance Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(65, 64, 64);
            flex-wrap: wrap;
        }

        h1 {
            font-size: 35px;
            background-image: linear-gradient(to bottom right,rgb(59, 201, 59),rgb(0, 255, 255));
            color: transparent;
            padding: 4px;
            margin-bottom: 40px;
            border-radius: 8px;
            background-clip: text;
            transition: 170ms ease-in-out;
        }
        h1:hover{
            color: black;
            padding: 4px;
            background-clip: border-box;
            border: 3px solid black;
            box-shadow: 3px 3px black;
        }

        label {
            font-size: 20px;
        }

        .inp{
            font-size: 19px;
            margin: 10px;
            width: 200px;
            border-radius: 5px;
            background: transparent;
            border: 2px solid;
            transition: 120ms ease-in;
            font-weight: 450;
        }   
        .sel option{
            background: gray;
            border-radius: 10px;
        }
        .inp:hover{
            scale: 1.05;
            box-shadow:0px 0px 5px black,0px 0px 5px black ;
        }

        p {
            font-size: 19px;
            color: rgb(255, 255, 255);
            font-weight: 450;
        }

        .submit{
            font-size: 20px;
            border-radius: 10px;
            margin: 10px;
            border: 3px solid ;
            background-color: transparent;
            transition: 150ms ease-in-out;
            font-weight: 450;
        }

        .submit:hover{
            scale: 1.05;
            box-shadow:0px 0px 5px black,0px 0px 5px black ;
        }

        .box{
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            align-items: center;
            justify-content: start;
            background-image: linear-gradient(to bottom right,rgb(59, 201, 59),rgb(52, 214, 214));
            border: 5px solid black;
            max-width: fit-content;
            max-height: 60vh;
            padding: 15px;
            border-radius: 15px;
        }
        

    </style>
</head>
<body>
    <h1>Attendance Calculator</h1>

    <div class="box appearance">

        <label>Total Number of lectures:-</label>
        <input class="inp" type="number" id="totalAttendance" action="">

        <label>Number of lectures attended:-</label>
        <input class="inp" type="number" id="lecturesAttended" action="">

        <label>Required Percentage:-</label>
        <select class="inp sel" id='requiredPercentage' >
            <option disabled selected>Select</option>
            <option value="75">75%</option>
            <option value="80">80%</option>
            <option value="85">85%</option>
            <option value="90">90%</option>
            <option value="95">95%</option>
            <option value="99">99%</option>
        </select>

        <button onclick="display()" class="submit">Submit</button>

        <p id="out1"></p>
        <p id="out2"></p>

    </div>

    <script>
        function display(){
            let totalAttendance = parseInt(document.getElementById("totalAttendance").value) ;
            let lecturesAttended = parseInt(document.getElementById("lecturesAttended").value);
            let requiredPercentage = parseInt(document.getElementById("requiredPercentage").value);

            let calculatedPercentage = lecturesAttended/totalAttendance*100;

            if (totalAttendance==null || lecturesAttended==null || requiredPercentage==0){
                document.getElementById('out1').innerHTML='Please enter all the values!';
                document.getElementById('out2').innerHTML='';
            }

            else{
                document.getElementById('out1').innerHTML='Your Attendance Percentage is:- '+Math.trunc(calculatedPercentage)+'%';

                if (calculatedPercentage>=requiredPercentage){
                    bunkLectures=(lecturesAttended*100)/requiredPercentage-totalAttendance;
                    document.getElementById('out2').innerHTML='You can bunk '+ Math.trunc(bunkLectures)+' lectures.';
                }

                else{
                    let attendLectures=(totalAttendance*requiredPercentage-100*lecturesAttended)/(100-requiredPercentage);
                    document.getElementById('out2').innerHTML='You have to attend '+attendLectures+' more lectures.';
                }
            }
        }
    </script>
</body>
</html>
